version: 2

models:
  - name: mart_top_directors
    description: >
      Final analytical mart containing the top 10 IMDb directors by average rating,
      restricted to directors with at least 5 titles and at least 1000 combined votes.
      Grain: one row per director.

    columns:
      - name: person_id
        description: IMDb identifier of the director.
        data_tests:
          - not_null
          - unique
      - name: director_name
        description: Primary name of the director.
        data_tests:
          - not_null

      - name: title_count
        description: Number of distinct rated titles associated with the director.
        data_tests:
          - not_null

      - name: combined_votes
        description: Total number of votes across all rated titles of the director.
        data_tests:
          - not_null

      - name: average_rating
        description: Simple average of IMDb ratings across the director's titles.
        data_tests:
          - not_null

      - name: weighted_average_rating
        description: Vote-weighted average rating across the director's titles.
        data_tests:
          - not_null

      - name: rank
        description: Position of the director in the final top 10 ranking.
        data_tests:
          - not_null
          - unique

  - name: mart_runtime_by_decade
    description: >
      Aggregated IMDb movie runtime and rating statistics by release decade.
    columns:
      - name: decade
        description: Release decade of the movies.
        data_tests:
          - not_null
          - unique

      - name: movie_count
        description: Number of distinct movies in the decade.
        data_tests:
          - not_null

      - name: average_runtime
        description: Average runtime in minutes for movies in the decade.
        data_tests:
          - not_null

      - name: average_rating
        description: Average IMDb rating for movies in the decade.
        data_tests:
          - not_null

      - name: runtime_rating_correlation
        description: Pearson correlation between movie runtime and IMDb rating within the decade.

  - name: mart_genre_quality_analysis
    description: >
      Genre-level analysis comparing hidden gems and overrated IMDb titles.
      Hidden gems are titles with average_rating >= 8.0 and
      100 <= num_votes < 10000. Overrated titles have
      average_rating <= 6.0 and num_votes >= 100000.
      Genres with fewer than 100 titles are excluded to avoid unstable ratios.

    columns:
      - name: genre_name
        description: IMDb genre name.
        data_tests:
          - not_null
          - unique

      - name: title_count
        description: Number of distinct rated titles in the genre.
        data_tests:
          - not_null

      - name: hidden_gem_count
        description: Number of titles classified as hidden gems.
        data_tests:
            - not_null

      - name: overrated_count
        description: Number of titles classified as overrated.
        data_tests:
            - not_null

      - name: hidden_gem_ratio
        description: Share of genre titles classified as hidden gems.
        data_tests:
            - not_null

      - name: overrated_ratio
        description: Share of genre titles classified as overrated.
        data_tests:
            - not_null
  - name: mart_person_genre_performance
    description: >
      Performance by person, role, and genre for actors and directors
      over the last 20 years.

    columns:
      - name: person_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_id

      - name: primary_name
        data_tests:
          - not_null

      - name: role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 'actor', 'director' ]

      - name: genre_name
        data_tests:
          - not_null

      - name: title_count
        data_tests:
          - not_null

      - name: combined_votes
        data_tests:
          - not_null

      - name: average_rating
        data_tests:
          - not_null

      - name: weighted_average_rating
        data_tests:
          - not_null